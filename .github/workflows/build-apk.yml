name: Build APK & Deploy Web

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor & Generate Android Project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject WhatsApp-like Persistent Background & Always-Allow Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i \
            <uses-permission android:name="android.permission.INTERNET" />\
            <uses-permission android:name="android.permission.RECORD_AUDIO" />\
            <uses-permission android:name="android.permission.CAMERA" />\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
            <uses-permission android:name="android.permission.VIBRATE" />\
            <uses-permission android:name="android.permission.WAKE_LOCK" />\
            <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\
            <uses-feature android:name="android.hardware.camera" android:required="false" />\
            <uses-feature android:name="android.hardware.microphone" android:required="false" />' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../www/NexChat-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexChat-Pro-APK
          path: www/NexChat-Pro.apk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          
